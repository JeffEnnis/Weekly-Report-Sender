name: Weekly Report

# Runs automatically every Wednesday at 8:00 AM Pacific Time,
# and can also be triggered manually from the Actions tab for testing.
#
# NOTE ON TIME: GitHub Actions schedules run in UTC. Pacific Time is
# UTC-8 (PST, Nov-Mar) or UTC-7 (PDT, Mar-Nov), so 8:00 AM Pacific is
# 15:00 or 16:00 UTC depending on the season. The cron line below is
# set for PDT (summer). If your Wednesday reports start arriving an
# hour off after a season change, adjust the "15" to "16" (or vice
# versa) — GitHub Actions does not auto-adjust for daylight saving.
on:
  schedule:
    - cron: "0 15 * * 3"   # 8:00 AM PDT (summer) / 15:00 UTC, every Wednesday
  workflow_dispatch: {}     # lets you click "Run workflow" manually to test

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic python-docx openpyxl msal requests

      - name: Run weekly report script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python3 weekly_report.py

      - name: Commit updated leads tracker back to the repo
        run: |
          git config user.name "weekly-report-bot"
          git config user.email "actions@github.com"
          git add leads_tracker.xlsx
          git diff --staged --quiet || git commit -m "Update leads tracker $(date +'%Y-%m-%d')"
          git push
